<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página no encontrada · Escuela de Póker</title>
  <link rel="icon" href="/img/icon.svg" type="image/svg+xml">
  <style>
    :root { --bg: #f2f3f1; --panel: #ffffff; --ink: #141918; --muted: #66706b; --accent: #0d6a47; --accent-ink: #ffffff; --line: #dde0db; color-scheme: light; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0c100f; --panel: #131816; --ink: #e7ebe9; --muted: #8b9690; --accent: #3bb582; --accent-ink: #03150d; --line: #232b28; color-scheme: dark; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; box-sizing: border-box; background: var(--bg); color: var(--ink); font: 15px/1.55 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; }
    main { max-width: 440px; text-align: center; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 32px 24px; }
    .num { font: 600 56px/1 "Bahnschrift", "DIN Alternate", system-ui, sans-serif; color: var(--accent); }
    h1 { font: 600 22px/1.2 "Bahnschrift", "DIN Alternate", system-ui, sans-serif; margin: 12px 0 8px; }
    p { color: var(--muted); margin: 0 0 22px; }
    a { display: inline-flex; align-items: center; height: 42px; padding: 0 18px; border-radius: 6px; background: var(--accent); color: var(--accent-ink); font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <div class="num">404</div>
    <h1>Esta página no existe</h1>
    <p>Puede que el enlace esté mal escrito o que la página se haya movido.</p>
    <a href="/">Volver a la Escuela de Póker</a>
  </main>
</body>
</html>
